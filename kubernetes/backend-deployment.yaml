apiVersion: apps/v1
kind: Deployment

metadata:
  name: backend
  namespace: evaluacion

spec:

  replicas: 2

  selector:

    matchLabels:
      app: backend

  template:

    metadata:

      labels:
        app: backend

    spec:

      containers:

        - name: backend

          image: dantito/proyecto-backend:latest

          imagePullPolicy: Always

          ports:

            - containerPort: 3000

          envFrom:

            - configMapRef:
                name: backend-config

          env:

            - name: DB_PASSWORD

              valueFrom:

                secretKeyRef:
                  name: backend-secret
                  key: DB_PASSWORD

          readinessProbe:

            httpGet:
              path: /
              port: 3000

            initialDelaySeconds: 5
            periodSeconds: 5

          livenessProbe:

            httpGet:
              path: /
              port: 3000

            initialDelaySeconds: 15
            periodSeconds: 10