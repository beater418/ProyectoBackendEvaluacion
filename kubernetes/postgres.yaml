apiVersion: apps/v1
kind: Deployment

metadata:
  name: postgres
  namespace: evaluacion

spec:

  replicas: 1

  selector:

    matchLabels:
      app: postgres

  template:

    metadata:

      labels:
        app: postgres

    spec:

      containers:

        - name: postgres

          image: postgres:16-alpine

          ports:

            - containerPort: 5432

          env:

            - name: POSTGRES_USER
              value: "admin"

            - name: POSTGRES_PASSWORD

              valueFrom:

                secretKeyRef:
                  name: backend-secret
                  key: DB_PASSWORD

            - name: POSTGRES_DB
              value: "database"

          volumeMounts:

            - name: postgres-data
              mountPath: /var/lib/postgresql/data

            - name: postgres-init
              mountPath: /docker-entrypoint-initdb.d

          readinessProbe:

            exec:

              command:

                - pg_isready
                - -U
                - admin
                - -d
                - database

            initialDelaySeconds: 5
            periodSeconds: 5

      volumes:

        - name: postgres-data

          persistentVolumeClaim:
            claimName: postgres-pvc

        - name: postgres-init

          configMap:
            name: postgres-init

---

apiVersion: v1
kind: Service

metadata:
  name: postgres-service
  namespace: evaluacion

spec:

  selector:
    app: postgres

  ports:

    - port: 5432
      targetPort: 5432

  type: ClusterIP