name: Develop CI/CD

on:
  push:
    branches:
      - develop

  workflow_dispatch:

jobs:

  build-and-push:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build y Push Backend
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            dantito/proyecto-backend:latest
            dantito/proyecto-backend:${{ github.run_number }}

      - name: Build y Push Backup
        uses: docker/build-push-action@v6
        with:
          context: ./backup
          push: true
          tags: |
            dantito/proyecto-backup:latest
            dantito/proyecto-backup:${{ github.run_number }}

      - name: Resultado
        run: |
          echo "Backend publicado:"
          echo "dantito/proyecto-backend:${{ github.run_number }}"
          echo "Backup publicado:"
          echo "dantito/proyecto-backup:${{ github.run_number }}"